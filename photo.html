<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현화스너 - 견적 및 발주 사진 접수</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; padding: 24px 16px; margin: 0; }
    .card { background: white; padding: 24px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); max-width: 440px; margin: auto; }
    h2 { font-size: 1.25rem; margin-top: 0; margin-bottom: 18px; color: #1e293b; text-align: center; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-top: 16px; margin-bottom: 6px; color: #334155; }
    input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; }
    input[type="file"] { width: 100%; padding: 10px; border: 1px dashed #94a3b8; border-radius: 8px; font-size: 0.95rem; background: #f8fafc; }
    textarea { resize: vertical; height: 90px; }
    button { width: 100%; padding: 15px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: bold; margin-top: 24px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📷 견적 및 발주 사진 접수</h2>
    <label>거래처명 (상호명) *</label>
    <input type="text" id="clientName" placeholder="상호명" required>
    
    <label>사진 첨부 (카메라 촬영 / 갤러리) *</label>
    <input type="file" id="photoFile" accept="image/*" capture="environment" required>
    
    <label>요청 메모 (선택)</label>
    <textarea id="memo" placeholder="규격, 재질, 수량 등 메모를 적어주세요."></textarea>
    
    <button id="submitBtn" onclick="submitPhoto()">사진 접수하기</button>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4pC0BbJl-iwzj_J8tpOT8fBCmSbx7WM8gBIG6qWJT0fvHJ2fjMtbxF6UV71l0FuJOjA/exec";

    // 1. 저장된 상호명 자동 로드 (여러 저장 키 모두 대응)
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('hf_client_name') || 
                    localStorage.getItem('clientName') || 
                    localStorage.getItem('companyName');
      if (saved) {
        const nameInput = document.getElementById('clientName');
        if (nameInput) nameInput.value = saved;
      }
    });

    // 2. 사진 접수 실행 함수
    function submitPhoto() {
      const nameInput = document.getElementById('clientName');
      const fileInput = document.getElementById('photoFile');
      const memoInput = document.getElementById('memo');
      const submitBtn = document.getElementById('submitBtn');

      const clientName = nameInput ? nameInput.value.trim() : "";
      const memo = memoInput ? memoInput.value.trim() : "";

      if (!clientName) {
        alert('거래처명을 입력해주세요.');
        if (nameInput) nameInput.focus();
        return;
      }

      // 다음에 접속할 때 자동 입력되도록 저장
      localStorage.setItem('hf_client_name', clientName);
      localStorage.setItem('clientName', clientName);

      if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        alert('첨부할 사진을 선택해주세요.');
        return;
      }

      const file = fileInput.files[0];

      // 버튼 중복 클릭 방지
      submitBtn.disabled = true;
      submitBtn.innerText = "사진 압축 및 전송 중...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // 모바일 용량 초과 방지를 위한 최대 1280px 리사이징
          const maxDim = 1280;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // 70% 품질 JPEG 압축
          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

          const payload = {
            action: "photoUpload",
            clientName: clientName,
            customerName: clientName,
            fileName: file.name.replace(/\.[^/.]+$/, "") + ".jpg",
            fileData: compressedBase64,
            fileBase64: compressedBase64,
            memo: memo
          };

          fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(payload)
          })
          .then(function() {
            alert('사진 접수가 정상적으로 완료되었습니다!');
            location.reload();
          })
          .catch(function(err) {
            alert('전송 중 오류가 발생했습니다: ' + err);
            submitBtn.disabled = false;
            submitBtn.innerText = "사진 접수하기";
          });
        };

        img.onerror = function() {
          alert('이미지 처리 중 오류가 발생했습니다.');
          submitBtn.disabled = false;
          submitBtn.innerText = "사진 접수하기";
        };

        img.src = e.target.result;
      };

      reader.onerror = function() {
        alert('파일을 읽는 중 오류가 발생했습니다.');
        submitBtn.disabled = false;
        submitBtn.innerText = "사진 접수하기";
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
