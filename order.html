<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현화스너 - 규격 볼트 발주</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; padding: 24px 16px; margin: 0; }
    .card { background: white; padding: 24px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); max-width: 440px; margin: auto; }
    h2 { font-size: 1.25rem; margin-top: 0; margin-bottom: 18px; color: #1e293b; text-align: center; }
    
    label.field-label { display: block; font-weight: 600; font-size: 0.9rem; margin-top: 16px; margin-bottom: 8px; color: #334155; }
    input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; }
    textarea { resize: vertical; height: 80px; }

    /* --- [헤드 선택 모듈: 충돌 방지 고유 클래스 bphoto-] --- */
    .bphoto-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 8px;
    }

    .bphoto-item {
      position: relative;
      display: block;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .bphoto-item input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .bphoto-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      background-color: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      box-sizing: border-box;
      transition: all 0.15s ease-in-out;
    }

    .bphoto-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #f8fafc;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .bphoto-img-wrap img {
      width: 85%;
      height: 85%;
      object-fit: contain;
      display: block;
    }

    .bphoto-label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      text-align: center;
    }

    /* 선택되었을 때 강조 스타일 */
    .bphoto-item input[type="radio"]:checked + .bphoto-box {
      border-color: #0284c7;
      background-color: #f0f9ff;
      box-shadow: 0 0 0 1.5px #0284c7;
    }

    .bphoto-item input[type="radio"]:checked + .bphoto-box .bphoto-label {
      color: #0284c7;
      font-weight: 700;
    }

    /* 하단 전송 버튼 */
    button { width: 100%; padding: 15px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: bold; margin-top: 24px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="card">
  <h2>🔩 볼트 규격 발주</h2>

  <label class="field-label">거래처명 (상호명) *</label>
  <input type="text" id="clientName" placeholder="상호명을 입력하세요" required>

  <label class="field-label">헤드 형태 선택 *</label>
  <div class="bphoto-grid">
    <!-- 1. 육각볼트 -->
    <label class="bphoto-item">
      <input type="radio" name="order_bolt_head" value="육각볼트" checked>
      <div class="bphoto-box">
        <div class="bphoto-img-wrap">
          <!-- 실제 이미지 파일 경로(예: ./images/bolt_hex.png)로 변경하세요 -->
          <img src="./images/bolt_hex.png" alt="육각볼트" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%2394a3b8\' stroke-width=\'2\'><rect width=\'18\' height=\'18\' x=\'3\' y=\'3\' rx=\'2\'/><circle cx=\'8.5\' cy=\'8.5\' r=\'1.5\'/><path d=\'m21 15-5-5L5 21\'/></svg>'">
        </div>
        <span class="bphoto-label">육각볼트</span>
      </div>
    </label>

    <!-- 2. 렌치볼트 -->
    <label class="bphoto-item">
      <input type="radio" name="order_bolt_head" value="렌치볼트">
      <div class="bphoto-box">
        <div class="bphoto-img-wrap">
          <img src="./images/bolt_socket.png" alt="렌치볼트" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%2394a3b8\' stroke-width=\'2\'><rect width=\'18\' height=\'18\' x=\'3\' y=\'3\' rx=\'2\'/><circle cx=\'8.5\' cy=\'8.5\' r=\'1.5\'/><path d=\'m21 15-5-5L5 21\'/></svg>'">
        </div>
        <span class="bphoto-label">렌치볼트</span>
      </div>
    </label>

    <!-- 3. 팬헤드(둥근) -->
    <label class="bphoto-item">
      <input type="radio" name="order_bolt_head" value="둥근머리(팬)">
      <div class="bphoto-box">
        <div class="bphoto-img-wrap">
          <img src="./images/bolt_pan.png" alt="팬헤드" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%2394a3b8\' stroke-width=\'2\'><rect width=\'18\' height=\'18\' x=\'3\' y=\'3\' rx=\'2\'/><circle cx=\'8.5\' cy=\'8.5\' r=\'1.5\'/><path d=\'m21 15-5-5L5 21\'/></svg>'">
        </div>
        <span class="bphoto-label">둥근머리(팬)</span>
      </div>
    </label>

    <!-- 4. 접시머리(사라) -->
    <label class="bphoto-item">
      <input type="radio" name="order_bolt_head" value="접시머리(사라)">
      <div class="bphoto-box">
        <div class="bphoto-img-wrap">
          <img src="./images/bolt_flat.png" alt="접시머리" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%2394a3b8\' stroke-width=\'2\'><rect width=\'18\' height=\'18\' x=\'3\' y=\'3\' rx=\'2\'/><circle cx=\'8.5\' cy=\'8.5\' r=\'1.5\'/><path d=\'m21 15-5-5L5 21\'/></svg>'">
        </div>
        <span class="bphoto-label">접시머리(사라)</span>
      </div>
    </label>
  </div>

  <label class="field-label">상세 규격 및 수량 *</label>
  <textarea id="memo" placeholder="예: M6 x 25L, SUS 500개"></textarea>

  <button id="submitBtn" onclick="submitOrder()">발주서 접수하기</button>
</div>

<script>
  // photo.html 37행에 쓰시던 구글 앱스 스크립트 웹앱 URL을 그대로 넣으시면 됩니다[cite: 1].
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbuw4pC0BbJl-iwzj_J8tpOT8fBCmSbx7WM8gBIG6qWJT0fvH32fjMtbxf6UV7110FuJ0jA/exec";

  function submitOrder() {
    const clientName = document.getElementById("clientName").value.trim();
    const memo = document.getElementById("memo").value.trim();
    const selectedHead = document.querySelector('input[name="order_bolt_head"]:checked')?.value;

    if (!clientName) {
      alert("거래처명을 입력해주세요.");
      return;
    }
    if (!memo) {
      alert("규격 및 수량을 입력해주세요.");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "접수 처리 중...";

    const payload = {
      action: "order",
      clientName: clientName,
      headType: selectedHead,
      memo: memo
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      alert("발주가 정상적으로 접수되었습니다!");
      location.reload();
    })
    .catch(err => {
      alert("접수 중 오류가 발생했습니다.");
      btn.disabled = false;
      btn.innerText = "발주서 접수하기";
    });
  }
</script>
</body>
</html>
