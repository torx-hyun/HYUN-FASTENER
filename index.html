<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>현화스너 (Hyun Fastener) 간편 발주 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-2xl flex flex-col pb-28 text-slate-800">

  <!-- 상단 헤더 -->
  <header class="bg-blue-900 text-white p-4 sticky top-0 z-30 shadow-md">
    <div class="flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="bg-blue-600 text-xs px-2 py-0.5 rounded font-bold">B2B</span>
          <h1 class="text-lg font-bold tracking-tight">현화스너 (Hyun Fastener)</h1>
        </div>
        <p class="text-xs text-blue-200 mt-0.5">간편 모바일 수발주 시스템</p>
      </div>
      <a href="tel:1551-5456" class="text-xs bg-blue-800/80 hover:bg-blue-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1 border border-blue-700">
        <i class="fa-solid fa-phone text-xs"></i> 1551-5456
      </a>
    </div>
  </header>

  <main class="p-3 space-y-3 flex-1">

    <!-- 1. 거래처 인증 섹션 -->
    <div class="bg-white rounded-xl p-3.5 shadow-sm border border-slate-200">
      <div class="flex items-center justify-between mb-2">
        <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-shield-halved text-blue-600"></i> 거래처 본인인증
        </label>
        <span id="authBadge" class="text-[11px] text-amber-700 font-bold bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded">인증 필요</span>
      </div>

      <!-- 입력창 (인증 전 표시) -->
      <div id="bizInputArea" class="relative flex gap-1.5">
        <input type="text" id="bizInput" placeholder="사업자번호 뒷 5자리 (예: 48452)" maxlength="5"
          class="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono tracking-wider">
        <button id="searchBtn" onclick="searchCompany()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shrink-0 transition flex items-center gap-1">
          <span id="searchBtnText">조회</span>
        </button>
      </div>

      <!-- 거래처 정보 카드 -->
      <div id="companyInfoCard" class="mt-2.5 p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs space-y-1">
        <div class="text-slate-500 text-center py-1 font-medium" id="authHelpText">
          사업자등록번호 뒷자리를 조회하셔야 발주서 작성이 가능합니다.
        </div>
        <div id="companyDetails" class="hidden space-y-1">
          <div class="flex justify-between items-center">
            <span class="font-bold text-blue-950 text-sm" id="cName">-</span>
            <div class="flex items-center gap-1">
              <span class="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded text-[10px] font-semibold" id="cCode">코드: -</span>
              <button onclick="resetAuth()" class="text-[10px] text-slate-400 hover:text-red-600 underline ml-1">변경</button>
            </div>
          </div>
          <div class="text-slate-600 flex gap-2">
            <span>대표: <b class="text-slate-800" id="cCeo">-</b></span>
            <span>연락처: <b class="text-slate-800" id="cPhone">-</b></span>
          </div>
          <div class="text-slate-600 truncate">
            <span>배송지: </span><span class="text-slate-800" id="cAddr">-</span>
          </div>
        </div>
      </div>

      <!-- 신규 거래처 등록 신청 안내 -->
      <div id="newClientArea" class="mt-2 pt-2 border-t border-slate-100 flex justify-between items-center text-[11px]">
        <span class="text-slate-500">처음 발주하시는 거래처이신가요?</span>
        <button type="button" onclick="openRegisterModal()" class="text-blue-600 font-bold hover:underline flex items-center gap-1">
          <i class="fa-solid fa-user-plus"></i> 신규 거래처 신청
        </button>
      </div>
    </div>

    <!-- 2. 품목 선택기 -->
    <div class="bg-white rounded-xl p-3.5 shadow-sm border border-slate-200 space-y-3 relative">
      <h2 class="text-xs font-bold text-slate-700 flex items-center gap-1.5 border-b pb-2">
        <i class="fa-solid fa-layer-group text-blue-600"></i> 규격 클릭식 선택
      </h2>

      <!-- [A] 재질 및 도금 -->
      <div>
        <span class="text-[11px] font-semibold text-slate-500 block mb-1.5">1. 재질 및 도금</span>
        <div class="grid grid-cols-3 gap-1.5 text-xs" id="matGroup">
          <button type="button" onclick="selectMat('스텐', this)" class="mat-btn py-2 px-1 border border-blue-600 bg-blue-50 font-bold text-blue-700 rounded-lg text-center transition">스텐 (304)</button>
          <button type="button" onclick="selectMat('스텐(316L)', this)" class="mat-btn py-2 px-1 border border-slate-200 hover:bg-slate-50 rounded-lg text-center transition">스텐(316L)</button>
          <button type="button" onclick="selectMat('철-NI', this)" class="mat-btn py-2 px-1 border border-slate-200 hover:bg-slate-50 rounded-lg text-center transition">철-NI</button>
          <button type="button" onclick="selectMat('SCM-NI', this)" class="mat-btn py-2 px-1 border border-slate-200 hover:bg-slate-50 rounded-lg text-center transition">SCM-NI</button>
          <button type="button" onclick="selectMat('SCM-무전해', this)" class="mat-btn py-2 px-1 border border-slate-200 hover:bg-slate-50 rounded-lg text-center transition">SCM-무전해</button>
          <button type="button" onclick="selectMat('SCM-착색', this)" class="mat-btn py-2 px-1 border border-slate-200 hover:bg-slate-50 rounded-lg text-center transition">SCM-착색</button>
          <button type="button" onclick="selectMat('철-천연색', this)" class="mat-btn py-2 px-1 border border-slate-200 hover:bg-slate-50 rounded-lg text-center transition">철-천연색</button>
        </div>
      </div>

      <!-- [B] 헤드 형태 -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <span class="text-[11px] font-semibold text-slate-500">2. 헤드 형태</span>
          <span class="text-[10px] text-amber-600 font-medium" id="headNotice">* 재질별 가능 규격만 활성화</span>
        </div>
        <div class="flex flex-wrap gap-1.5 max-h-44 overflow-y-auto p-1 bg-slate-50 rounded-lg border border-slate-200" id="headContainer"></div>
      </div>

      <!-- [C] 직경 & 길이 -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <span class="text-[11px] font-semibold text-slate-500 block mb-1">3. 호칭경 (직경)</span>
          <select id="diaSelect" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="updatePreviewText()">
            <option value="M1.6">M1.6</option>
            <option value="M2">M2</option>
            <option value="M2.5">M2.5</option>
            <option value="M2.6">M2.6</option>
            <option value="M3" selected>M3</option>
            <option value="M4">M4</option>
            <option value="M5">M5</option>
            <option value="M6">M6</option>
            <option value="M8">M8</option>
            <option value="M10">M10</option>
            <option value="1/4(INCH)">1/4 (인치)</option>
            <option value="5/16(INCH)">5/16 (인치)</option>
          </select>
        </div>
        <div>
          <span class="text-[11px] font-semibold text-slate-500 block mb-1">4. 길이 (L)</span>
          <select id="lenSelect" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="updatePreviewText()">
            <option value="4L">4L</option>
            <option value="5L">5L</option>
            <option value="6L">6L</option>
            <option value="8L">8L</option>
            <option value="10L" selected>10L</option>
            <option value="12L">12L</option>
            <option value="15L">15L</option>
            <option value="20L">20L</option>
            <option value="25L">25L</option>
            <option value="30L">30L</option>
            <option value="35L">35L</option>
            <option value="40L">40L</option>
          </select>
        </div>
      </div>

      <!-- [D] 봉단위 수량 선택 -->
      <div class="bg-amber-50/70 p-2.5 rounded-lg border border-amber-200">
        <span class="text-[11px] font-semibold text-amber-900 block mb-1.5">5. 봉(Bag) 포장단위 및 수량</span>
        <div class="grid grid-cols-6 gap-1 text-[11px] mb-2" id="bagTypeGroup">
          <button type="button" onclick="selectBagUnit(2000, this)" class="bag-unit-btn py-1.5 border border-slate-200 bg-white rounded font-medium text-center">2,000</button>
          <button type="button" onclick="selectBagUnit(1000, this)" class="bag-unit-btn py-1.5 border border-amber-600 bg-amber-100 rounded font-bold text-amber-900 text-center">1,000</button>
          <button type="button" onclick="selectBagUnit(500, this)" class="bag-unit-btn py-1.5 border border-slate-200 bg-white rounded font-medium text-center">500</button>
          <button type="button" onclick="selectBagUnit(300, this)" class="bag-unit-btn py-1.5 border border-slate-200 bg-white rounded font-medium text-center">300</button>
          <button type="button" onclick="selectBagUnit(200, this)" class="bag-unit-btn py-1.5 border border-slate-200 bg-white rounded font-medium text-center">200</button>
          <button type="button" onclick="selectBagUnit(100, this)" class="bag-unit-btn py-1.5 border border-slate-200 bg-white rounded font-medium text-center">100</button>
        </div>

        <div class="flex items-center justify-between pt-1">
          <div class="flex items-center gap-2">
            <span class="text-xs text-slate-600 font-medium">발주 봉수:</span>
            <div class="flex items-center border border-slate-300 rounded bg-white">
              <button onclick="changeBagCount(-1)" class="w-7 h-7 flex items-center justify-center font-bold text-slate-600 hover:bg-slate-100">-</button>
              <input type="number" id="bagCount" value="1" min="1" class="w-10 text-center text-xs font-bold focus:outline-none" onchange="calcTotalQty()">
              <button onclick="changeBagCount(1)" class="w-7 h-7 flex items-center justify-center font-bold text-slate-600 hover:bg-slate-100">+</button>
            </div>
            <span class="text-xs font-bold text-slate-700">봉</span>
          </div>

          <div class="text-right">
            <span class="text-[10px] text-slate-600 block">총 수량</span>
            <span class="text-sm font-extrabold text-blue-700" id="calcQtyResult">1,000개</span>
          </div>
        </div>
      </div>

      <!-- 선택된 품목 요약 & 담기 -->
      <div class="pt-1">
        <div class="p-2 bg-slate-100 rounded-lg text-xs font-medium text-slate-700 mb
